<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101B2B" />
  <title>SOLO GELATOS | Panel Administrativo y Bitácora</title>

  <link rel="icon" type="image/png" href="assets/brand/logo-badge.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- Estilos modulares -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/client.css" />
  <link rel="stylesheet" href="css/admin.css" />

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('solo_gelatos_theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="sg-admin-root"></div>

  <!-- Modal reutilizable para acciones CRUD del panel administrativo -->
  <div class="modal fade" id="sgAdminModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content rounded-4" id="sg-admin-modal-form">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold" id="sg-admin-modal-title">Acción</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body" id="sg-admin-modal-body"></div>
        <div class="modal-footer border-top">
          <button type="button" class="btn btn-sg-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-sg-primary btn-sm">Guardar cambios</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Librerías externas requeridas -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" crossorigin="anonymous"></script>

  <!-- Módulos compartidos y administrativos -->
  <script defer src="js/modules/theme.js"></script>
  <script defer src="js/modules/storage.js"></script>
  <script defer src="js/modules/eventLog.js"></script>
  <script defer src="api/apiDataFallback.js"></script>
  <script defer src="api/apiService.js"></script>
  <script defer src="js/modules/toast.js"></script>
  <script defer src="js/modules/cart.js"></script>
  <script defer src="js/modules/components.js"></script>
  <script defer src="js/admin/adminAuth.js"></script>
  <script defer src="js/admin/adminDashboard.js"></script>
  <script defer src="js/admin/adminEventLog.js"></script>
  <script defer src="js/admin/adminCrud.js"></script>
  <script defer src="js/admin-app.js"></script>
</body>
</html>

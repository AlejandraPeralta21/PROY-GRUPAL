<!DOCTYPE html>
<html lang="es">
<head>

<body>

        <button type="button" id="btnConsultarSupa" class="btn">Consultar Promociones</button>
        <button type="button" id="btnEncolarFifo" class="btn sec">Simular Cola FIFO Offline</button>

      <div id="salidaSupa" class="salida" aria-live="polite">Listo para conectar con Supabase.</div>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Solo Gelatos — Semana 1: Validación de Formulario</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <!-- Semana 1 - Validacion Formulario -->
  <header class="cabecera"><h1>Solo Gelatos — Validación Segura de Formulario</h1></header>
  <main class="contenedor">
    <section class="tarjeta">
      <h2>Contacto de Pedidos Especiales</h2>
      <p class="ayuda">Ingresa tu nombre y correo electrónico válido; el sistema valida con Regex y construye alertas seguras con createElement y textContent.</p>
      <form id="formularioContacto" novalidate>
        <div class="campo"><label for="campoNombre">Nombre completo</label><input id="campoNombre" type="text" placeholder="Ej. Camila Rojas"></div>
        <div class="campo"><label for="campoCorreo">Correo electrónico</label><input id="campoCorreo" type="email" placeholder="cliente@sologelatos.bo"></div>
        <button type="submit" class="btn">Enviar Formulario</button>
      </form>
      <div id="cajaAlerta" aria-live="polite"></div>
    </section>
  </main>
  <footer class="pie">Solo Gelatos · Semana 1 · Módulo 04</footer>
</body>
</html>

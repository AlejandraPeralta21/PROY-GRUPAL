<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Solo Gelatos — Semana 1: Bitácora Día 1</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <!-- Semana 1 - Bitacora Dia 1 -->
  <header class="cabecera"><h1>Solo Gelatos — Bitácora de Eventos Día 1</h1></header>
  <main class="contenedor">
    <section class="tarjeta">
      <h2>Event Bubbling y Monitor de Teclado</h2>
      <p class="ayuda">Haz clic en un producto, doble clic en Like o escribe en el chat para registrar eventos en tiempo real con prepend().</p>
      <div id="contenedorLive" class="acciones">
        <button type="button" class="btn" data-prod="Helado Frutilla">Seleccionar Helado Frutilla</button>
        <button type="button" class="btn" data-prod="Frappé Oreo">Seleccionar Frappé Oreo</button>
        <button type="button" class="btn sec" data-action="like">Like / Doble Clic Super Like</button>
      </div>
      <div class="campo">
        <label for="campoChat">Chat en vivo (evento keyup)</label>
        <input id="campoChat" type="text" placeholder="Escribe un comentario sobre tu sabor favorito...">
      </div>
      <div id="salidaBitacora" class="log" aria-live="polite"></div>
    </section>
  </main>
  <footer class="pie">Solo Gelatos · Semana 1 · Módulo 05</footer>
</body>
</html>

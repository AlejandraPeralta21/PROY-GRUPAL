<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Solo Gelatos — Semana 3: Componentes y Encapsulamiento</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <!-- Semana 3 - Componentes Encapsulados -->
  <header class="cabecera"><h1>Solo Gelatos — Componentes Encapsulados BEM</h1></header>
  <main class="contenedor">
    <p class="ayuda">Cada tarjeta usa el bloque encapsulado .card-item y el botón .card-item__btn-simular sin fugas de estilo.</p>
    <section class="grid">
      <article class="card-item">
        <img class="card-item__img" src="https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&w=720&q=82" alt="Helado Frutilla artesanal" loading="lazy">
        <div class="card-item__body">
          <h2 class="card-item__title">Helado Frutilla</h2>
          <p class="card-item__price">25 Bs</p>
          <button type="button" class="card-item__btn-simular" data-prod="Helado Frutilla">Simular Porción</button>
        </div>
      </article>
      <article class="card-item">
        <img class="card-item__img" src="https://images.unsplash.com/photo-1562376552-0d160a2f238d?auto=format&fit=crop&w=720&q=82" alt="Waffle con Frutas artesanal" loading="lazy">
        <div class="card-item__body">
          <h2 class="card-item__title">Waffle con Frutas</h2>
          <p class="card-item__price">32 Bs</p>
          <button type="button" class="card-item__btn-simular" data-prod="Waffle con Frutas">Simular Porción</button>
        </div>
      </article>
    </section>
    <div id="estadoSimulacion" class="salida" aria-live="polite">Selecciona un producto para simular su ficha.</div>
  </main>
  <footer class="pie">Solo Gelatos · Semana 3 · Módulo 01</footer>
</body>
</html>

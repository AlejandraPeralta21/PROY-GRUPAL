<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#E92F70" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Solo Gelatos" />
  <meta name="description" content="SOLO GELATOS — El sabor que te hace feliz. Helados artesanales, milkshakes, copas especiales, frappés, cafés y pastelería helada." />
  <title>SOLO GELATOS | El sabor que te hace feliz</title>

  <link rel="icon" type="image/png" href="assets/brand/logo-badge.png" />
  <link rel="apple-touch-icon" href="assets/brand/logo-badge.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- Tipografías Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Pacifico&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5, Bootstrap Icons y jQuery UI -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.3/themes/base/jquery-ui.css" />

  <!-- Hojas de estilo modulares -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/client.css" />

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('solo_gelatos_theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- Escenario inicial: Pantalla de carga animada y Bienvenida -->
  <div id="sg-stage-root"></div>

  <!-- Contenedor principal de la aplicación cliente -->
  <div class="sg-app-shell">
    <div id="sg-header-root"></div>
    <main id="sg-page-root" class="flex-grow-1" role="main"></main>
    <footer class="container text-center py-3 mt-2 border-top small text-muted">
      <div class="d-flex flex-wrap justify-content-center align-items-center gap-3">
        <span><strong class="text-raspberry">SOLO GELATOS</strong> · El sabor que te hace feliz</span>
        <span><i class="bi bi-instagram text-raspberry me-1"></i>@solo.gelatos</span>
        <span><i class="bi bi-facebook text-turquoise me-1"></i>Solo Gelatos</span>
        <a href="admin.html" class="text-decoration-none text-turquoise fw-semibold"><i class="bi bi-shield-lock me-1"></i>Acceso Administrativo</a>
      </div>
    </footer>
    <div id="sg-bottom-nav-root"></div>
    <div id="sg-drawer-root"></div>
  </div>

  <!-- Librerías externas requeridas -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/ui/1.13.3/jquery-ui.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

  <!-- Módulos propios del sistema -->
  <script defer src="js/modules/theme.js"></script>
  <script defer src="js/modules/storage.js"></script>
  <script defer src="js/modules/eventLog.js"></script>
  <script defer src="api/apiDataFallback.js"></script>
  <script defer src="api/apiService.js"></script>
  <script defer src="js/modules/toast.js"></script>
  <script defer src="js/modules/cart.js"></script>
  <script defer src="js/modules/components.js"></script>

  <!-- Vistas de la aplicación cliente -->
  <script defer src="js/pages/splashWelcome.js"></script>
  <script defer src="js/pages/homeCatalog.js"></script>
  <script defer src="js/pages/categoriesPage.js"></script>
  <script defer src="js/pages/filtersPage.js"></script>
  <script defer src="js/pages/productDetail.js"></script>
  <script defer src="js/pages/cartCheckout.js"></script>
  <script defer src="js/pages/ordersProfile.js"></script>
  <script defer src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js').catch(function (error) {
          console.warn('No se pudo activar el modo sin conexión:', error);
        });
      }, { once: true });
    }
  </script>
</body>
</html>
